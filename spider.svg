<svg width="90" height="420" viewBox="0 0 90 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .thread{ stroke:#5b5b5b; stroke-width:1.4; }
      .body{ fill:#161616; }
      .leg{ stroke:#161616; stroke-width:2.4; fill:none; stroke-linecap:round; }
      .eye{ fill:#e63946; }
    </style>
  </defs>

  <!-- silk thread, grows and shrinks as the spider drops and climbs -->
  <line class="thread" x1="45" y1="0" x2="45" y2="60">
    <animate attributeName="y2"
      values="60;340;340;60;60"
      keyTimes="0;0.35;0.55;0.9;1"
      dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- spider group: travels down the thread, with a gentle idle sway -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,60; 0,340; 0,340; 0,60; 0,60"
      keyTimes="0;0.35;0.55;0.9;1"
      dur="9s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-6 45 0; 6 45 0; -6 45 0"
        dur="2.4s" repeatCount="indefinite" additive="sum"/>

      <!-- legs -->
      <path class="leg" d="M30,4 C18,-2 8,4 2,12"/>
      <path class="leg" d="M30,10 C16,10 6,16 0,26"/>
      <path class="leg" d="M32,16 C20,22 12,30 8,40"/>
      <path class="leg" d="M60,4 C72,-2 82,4 88,12"/>
      <path class="leg" d="M60,10 C74,10 84,16 90,26"/>
      <path class="leg" d="M58,16 C70,22 78,30 82,40"/>

      <!-- body -->
      <ellipse class="body" cx="45" cy="6" rx="9" ry="7"/>
      <ellipse class="body" cx="45" cy="20" rx="15" ry="13"/>
      <circle class="eye" cx="40" cy="16" r="1.6"/>
      <circle class="eye" cx="50" cy="16" r="1.6"/>
    </g>
  </g>
</svg>
